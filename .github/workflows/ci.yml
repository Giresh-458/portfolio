name: Portfolio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/demon-slayer-cinematic-motion]

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); console.log("NPM_AUDIT_SUMMARY",JSON.stringify(a.metadata?.vulnerabilities)); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log("NPM_AUDIT_ITEM",JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:x.title)}))'
      - name: Unit tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://portfolio-ci.example.invalid
