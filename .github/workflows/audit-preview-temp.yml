name: Temporary non-breaking npm audit preview
on:
  push:
    branches: [feature/demon-slayer-cinematic-motion]
permissions:
  contents: read
jobs:
  audit-fix-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply non-breaking lockfile-only audit fixes
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Summarize resulting audit
        run: |
          npm audit --json > /tmp/npm-audit-after.json || true
          node -e 'const a=require("/tmp/npm-audit-after.json"); console.log("NPM_AUDIT_AFTER",JSON.stringify(a.metadata?.vulnerabilities)); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log("NPM_AUDIT_ITEM",JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:x.title)}))'
      - name: Upload candidate lockfile
        uses: actions/upload-artifact@v4
        with:
          name: audited-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
